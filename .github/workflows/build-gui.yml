name: Build GUI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: linux/amd64
            os: ubuntu-22.04
          - name: macOS
            platform: darwin/universal
            os: macos-latest

    runs-on: ${{ matrix.os }}
    name: Build GUI - ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build GUI
        run: |
          wails build -platform ${{ matrix.platform }} -clean

      - name: Rename binary with platform name
        run: |
          cd build/bin
          for file in *; do
            if [ -f "$file" ]; then
              # Extract OS from platform (linux/amd64 -> linux, darwin/universal -> darwin)
              OS=$(echo "${{ matrix.platform }}" | cut -d'/' -f1)
              ARCH=$(echo "${{ matrix.platform }}" | cut -d'/' -f2)
              mv "$file" "${file}-${OS}-${ARCH}"
            fi
          done

      - name: Upload GUI to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
