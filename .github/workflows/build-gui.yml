name: Build GUI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            platform: linux/amd64
            os: ubuntu-22.04
          - name: macOS
            platform: darwin/universal
            os: macos-latest
          - name: Windows
            platform: windows/amd64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    name: Build GUI - ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build GUI
        run: |
          wails build -platform ${{ matrix.platform }} -clean

      - name: Prepare release artifacts
        shell: bash
        run: |
          cd build/bin
          OS=$(echo "${{ matrix.platform }}" | cut -d'/' -f1)
          ARCH=$(echo "${{ matrix.platform }}" | cut -d'/' -f2)
          
          if [ "$OS" = "darwin" ]; then
            # macOS: compress .app bundle
            for app in *.app; do
              if [ -d "$app" ]; then
                zip -r "${app%.app}-${OS}-${ARCH}.zip" "$app"
                rm -rf "$app"
              fi
            done
          elif [ "$OS" = "windows" ]; then
            # Windows: rename .exe
            for file in *.exe; do
              if [ -f "$file" ]; then
                mv "$file" "${file%.exe}-${OS}-${ARCH}.exe"
              fi
            done
          else
            # Linux: rename binary
            for file in *; do
              if [ -f "$file" ] && [ ! -f "${file}-${OS}-${ARCH}" ]; then
                mv "$file" "${file}-${OS}-${ARCH}"
              fi
            done
          fi

      - name: Upload GUI to release
        uses: softprops/action-gh-release@v1
        with:
          files: build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
